- id: 70
  list_cn: 三叶黄丝蟌
  cn: 三叶黄丝蟌
  sci: Sympecma paedisca
  author: (Brauer, 1877)
  family: Lestidae
  status: valid
  verdict: 学名正确。北京有 2 条 iNaturalist 记录（延庆，2021、2023）。
