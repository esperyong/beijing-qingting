  verdict: 学名正确，北京朝阳、怀柔等地有记录（2015–2025）。
  tips: 黄绿色的中型春蜓，腹部细长，胸部黑纹较少。
  habitat: 平原的湖泊、池塘和缓流河道，是春蜓里少见的偏好静水的种类。

