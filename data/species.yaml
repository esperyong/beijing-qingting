# ---------------------------------------------------------------- 扇蟌科
- id: 71
  list_cn: 白狭扇蟌
  cn: 白狭扇蟌
  sci: Pseudocopera annulata
  author: (Selys, 1863)
  old: Copera annulata
  family: Platycnemididae
  status: doubtful
  verdict_short: 属名改为 Pseudocopera；北京无公开记录
  verdict: 物种有效，属名已从 <i>Copera</i> 改回 <i>Pseudocopera</i>（2014 年后）。北京在 iNaturalist 和 GBIF 上都没有记录，中国蜻蜓名录也没有列北京。日本有研究提出黑狭扇蟌可能只是白狭扇蟌的深色型，尚无定论。
  tips: 细长的豆娘，腹部黑色带白色环节，雄性足白色。
  habitat: 林荫下的池塘和溪流边。
- id: 72
  list_cn: 黑狭扇蟌
  cn: 黑狭扇蟌
  sci: Pseudocopera rubripes
  author: (Navás, 1934)
  old: Copera tokyoensis
  family: Platycnemididae
  status: renamed
  verdict_short: C. tokyoensis 是 P. rubripes 的异名
  verdict: 物种没问题，学名应写 <i>Pseudocopera rubripes</i>。于昕和 Hämäläinen 2021 年发表，<i>Copera tokyoensis</i> Asahina, 1948 是它的晚出异名。北京有 15 条 iNaturalist 记录。
  tips: 细长的豆娘，雄性腹部黑色，腹末有白斑，足红褐色（种名 rubripes 意为“红足”）。
  habitat: 水草多的池塘和沟渠。
