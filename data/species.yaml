  family: Libellulidae
  status: renamed
  inat: 52055
  verdict_short: 北京的红蜻就是 C. servilia；古北亚种 mariannae 只指日本种群
  verdict: >-
    北京的红蜻就是 <i>Crocothemis servilia</i>。“古北亚种” <i>mariannae</i> 是 Kiauta 1983 年依据大阪的标本、按染色体（雄性 2n=24）命名的，
    大陆种群（包括山西太原的标本）是 2n=25，属于原来的 <i>servilia</i>；Higashi 等 2001 年的结论是 <i>mariannae</i> 只分布在日本。
    世界蜻蜓名录和 GBIF 都把 <i>mariannae</i> 作为异名。《中国蜻蜓大图鉴》把华北的红蜻称为古北亚种，与原始文献不符。
  tips: 雄性全身鲜红，腹部背面中央有一条黑色细线。雌性黄褐色，少数雌性也是红色（同色系）。
