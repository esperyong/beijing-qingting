# 北京蜻蜓名录：老姜（北京蜻蜓社社长）统计的 84 条，顺序和编号照抄 docs/images/beijing-qingting-classifications/All.jpg。
#
# list_cn  名单原文（tiers.yaml 用它对应）
# cn       页面上显示的名字（去掉括号里的别名）
# sci      核查后的有效学名，author 是命名人和年份（以世界蜻蜓名录 WOL 为准，括号表示原属不同）
# old      名单对应的旧学名（属名变动、拆分或合并前的写法）
# family   科（WOL）
# status   valid 有效种 / renamed 学名已更新 / undetermined 待定种 / doubtful 需要核实
# verdict  核查结论；verdict_short 是名录表里的一句话版本
# tips     怎么认；habitat 生境（北京的月份和地点由 build.py 从 iNaturalist 记录算出）
# inat     iNaturalist 物种 id（不写时用 data/cache/taxa.json 里的匹配结果）

# ---------------------------------------------------------------- 蜓科
- id: 1
  list_cn: 长痣绿蜓
  cn: 长痣绿蜓
  sci: Brachytron longistigma
  author: (Selys, 1883)
  old: Aeschnophlebia longistigma
  family: Aeshnidae
  status: renamed
  verdict_short: 2023 年属名调整，Aeschnophlebia 改为 Brachytron
  verdict: >-
    物种和中文名都没问题，只是属名变了。2023 年 Kosterin 发现 <i>Aeschnophlebia</i> 属的模式种其实和黑额蜓属
    <i>Planaeschna</i> 是同一类，于是“黑额蜓”们改用 <i>Aeschnophlebia</i> 这个更早的属名，原来的两种“绿蜓”
    转入 <i>Brachytron</i>。世界蜻蜓名录和 iNaturalist 已经采用，国内图鉴多数还用旧名。
  tips: 中型蜓，草绿色身体带黑色条纹；翅痣特别细长，名字由此而来。
  habitat: 芦苇、香蒲茂密的池塘和湿地，常贴着挺水植物低飞，不容易看清。

- id: 2
  list_cn: 混合蜓
  cn: 混合蜓
  sci: Aeshna soneharai
  author: Asahina, 1988
  old: Aeshna mixta
  family: Aeshnidae
  status: renamed
  inat: 1398282
  verdict_short: 北京这种应为曾根原蜓 A. soneharai（2022 年从混合蜓拆出）
  verdict: >-
    北京的“混合蜓”应改称<b>曾根原蜓</b>。2022 年 Onishko 等人把东部种群从混合蜓 <i>Aeshna mixta</i>
    中分出，恢复为独立种 <i>A. soneharai</i>，世界蜻蜓名录已采用。张浩淼《中国蜻蜓大图鉴》（2019）出版时还没有这次拆分，
    所以国内很多资料仍叫混合蜓。iNaturalist 上曾根原蜓有 28 条北京记录，而 <i>A. mixta</i> 一条都没有。
  tips: 中型蜓。雄性腹部有成对的蓝色斑点，第 2 腹节背面有一个黄色的“T”形斑。雌性多为黄绿色斑点（黄色型），少数是蓝色斑点（同色系）。
  habitat: 夏末到秋季出现，常在林缘和水边空地上空巡飞，停落时挂在枝叶间。

- id: 3
  list_cn: 极北蜓
  cn: 极北蜓
  sci: Aeshna subarctica
  author: Walker, 1908
  family: Aeshnidae
  status: doubtful
  verdict_short: 北京无可靠记录，更可能是峻蜓 Aeshna juncea
  verdict: >-
    名字和学名对得上，但北京没有可靠记录。极北蜓只生活在泥炭藓沼泽，国内另一笔记录在吉林；iNaturalist 上唯一的北京记录
    位置误差 3.9 km、落在顺义平原，可信度很低。北京山区更可能遇到的是<b>峻蜓 <i>Aeshna juncea</i></b>，
    喇叭沟门 2026 年 8 月有一条研究级记录。两种的雌性都有黄色型和同色系，只看雌性色型分不开，要看雄性肛附器和胸侧条纹。
  tips: 中型蜓，雄性腹部蓝斑，胸侧黄色条纹窄。和峻蜓极像，野外很难分。
  habitat: 寒冷地区的泥炭藓沼泽。北京如果有，只会在海拔较高的山地湿地。
  links: [["峻蜓的北京记录（喇叭沟门）", "https://www.inaturalist.org/observations/392303772"]]

- id: 4
  list_cn: 斑伟蜓
  cn: 斑伟蜓
  sci: Anax guttatus
  author: (Burmeister, 1839)
  family: Aeshnidae
  status: doubtful
  verdict_short: 南方种，北京无公开记录
  verdict: >-
    学名正确，是有效种。它是南方种类，能长距离飞行，北京出现迷途个体是可能的；但 iNaturalist 和 GBIF 上都没有北京及周边
    （北纬 36° 以北）的可核实记录。拍到的话请保留照片和地点。
  tips: 大型伟蜓，胸部绿色。雄性腹部第 2–3 节天蓝色，后翅基部有一块琥珀色斑。
  habitat: 华南、西南的池塘和湖泊很常见，北京只可能是随气流北上的个体。

- id: 5
  list_cn: 黑纹伟蜓
  cn: 黑纹伟蜓
  sci: Anax nigrofasciatus
  author: Oguma, 1915
  family: Aeshnidae
  status: valid
  verdict: 学名和名字都正确，北京有稳定种群。
  tips: 和碧伟蜓相似，但胸侧有明显的黑色条纹，腹部蓝黑相间。雌性有同色系、绿色型、黄色型几种色型。
  habitat: 春季比碧伟蜓出现得早，在水草丰富的池塘和山区水库巡飞。

- id: 6
  list_cn: 碧伟蜓灰胸亚种
  cn: 碧伟蜓灰胸亚种
  sci: Anax parthenope
  author: (Selys, 1839)
  family: Aeshnidae
  status: doubtful
  verdict_short: 已是独立种 A. parthenope；北京无可靠记录
  verdict: >-
    按世界蜻蜓名录，碧伟蜓已经拆成两个种：欧洲到中亚的 <i>Anax parthenope</i>（胸部灰褐，就是这里说的“灰胸”），
    和东亚的 <i>Anax julius</i>（胸部绿色，北京常见的碧伟蜓）。国内 <i>A. parthenope</i> 的近年记录几乎都在新疆，
    北京没有可核实记录。1920 年代北京被标为 parthenope 的老标本都早于拆分，实际应是 <i>A. julius</i>。
    在北京拍到“灰胸”的个体，更可能是刚羽化或衰老的东亚碧伟蜓，值得仔细比对。
  tips: 合胸灰褐到橄榄色，腹部第 2 节有一块天蓝色鞍斑。
  habitat: 欧洲、北非到中亚的湖泊和池塘；国内主要在新疆。

- id: 7
  list_cn: 碧伟蜓东亚亚种
  cn: 碧伟蜓东亚亚种
  sci: Anax julius
  author: Brauer, 1865
  old: Anax parthenope julius
  family: Aeshnidae
  status: renamed
  verdict_short: 2023 年升为独立种 Anax julius（东亚碧伟蜓）
  verdict: >-
    北京最常见的大型蜻蜓。2023 年 Onishko、Kosterin 和 Voinov 根据肛附器形态和分子数据，把它从碧伟蜓的亚种提升为独立种
    <i>Anax julius</i>，中文可称<b>东亚碧伟蜓</b>，世界蜻蜓名录已采用。
    名单里的“雄（拓蓝籽）”在网上查不到。北京老话把碧伟蜓的雄性叫“老杆儿”、雌性叫“老籽儿”，“拓蓝籽”大概是社里对某种蓝色范围特别大的个体的叫法，具体所指请以老姜的解释为准。
  tips: 胸部全绿、没有黑纹。雄性腹部第 2 节天蓝色，雌性这里多为绿褐色。
  habitat: 公园湖泊、池塘、河道都很常见，雄性沿岸来回巡飞，几乎不停。老北京孩子抓的“老杆儿”就是它。

- id: 8
  list_cn: 长者头蜓
  cn: 长者头蜓
  sci: Cephalaeschna patrorum
  author: Needham, 1930
  family: Aeshnidae
  status: valid
  verdict: 学名正确，北京山区有稳定记录。
  tips: 暗褐色带黄绿色斑纹的中型蜓，头部宽大。
  habitat: 山区林荫下的小溪，多在黄昏或阴天活动。

- id: 9
  list_cn: 山西黑额蜓
  cn: 山西黑额蜓
  sci: Aeschnophlebia shanxiensis
  author: (Zhu & Zhang, 2001)
  old: Planaeschna shanxiensis
  family: Aeshnidae
  status: renamed
  verdict_short: 2023 年属名调整，Planaeschna 改为 Aeschnophlebia
  verdict: 物种没问题，属名因 2023 年的分类调整改为 <i>Aeschnophlebia</i>（原因见长痣绿蜓）。北京山区溪流很常见。名单里的“雌雄同体”是极罕见的发育异常个体。
  tips: 额头黑色，黑褐色身体上有黄绿色斑点和条纹，复眼蓝绿色。
  habitat: 山区溪流，林荫下常见。

# ---------------------------------------------------------------- 春蜓科
- id: 10
  list_cn: 马奇异春蜓
  cn: 马奇异春蜓
  sci: Anisogomphus maacki
  author: (Selys, 1872)
  family: Gomphidae
  status: valid
  verdict: 学名正确，北京常见。
  tips: 中型春蜓，黄绿色和黑色相间，胸部条纹清楚。
  habitat: 山区和平原的河流、溪流，常停在水边石头和草叶上。

- id: 11
  list_cn: 卧佛春蜓
  cn: 卧佛春蜓
  sci: Asiagomphus somnolens
  author: (Needham, 1929)
  family: Gomphidae
  status: doubtful
  inat: 433255
  verdict_short: 学名是卧佛亚春蜓 A. somnolens，但只有 1 只幼虫模式标本，成虫从未被描述
  verdict: >-
    对应的学名是<b>卧佛亚春蜓 <i>Asiagomphus somnolens</i></b>。“卧佛”是种名 somnolens（意为“沉睡的”）的意译，
    不一定指卧佛寺。这个种是 1929 年 Needham 依据北京采到的一只<b>幼虫</b>描述的，唯一的模式标本保存在美国康奈尔大学，
    至今没有人正式描述过成虫，iNaturalist 和 GBIF 上也没有任何成虫记录。所以被叫作“卧佛春蜓”的成虫照片，
    只有通过饲养幼虫羽化，才能真正和这个学名对上。这也是它被列为“传说”的原因之一。
  tips: 亚春蜓属，黄黑相间的中大型春蜓。成虫特征尚无正式描述。
  habitat: 模式标本采自北京，生境不详；亚春蜓属一般生活在山区溪流和河流。
  links: [["康奈尔大学模式标本（GBIF）", "https://www.gbif.org/occurrence/6177458772"]]

- id: 12
  list_cn: 西南亚春蜓(老姜亚春蜓)
  cn: 西南亚春蜓
  sci: Asiagomphus hesperius
  author: (Chao, 1953)
  family: Gomphidae
  status: undetermined
  inat: 562473
  verdict_short: 北京个体尚未鉴定到种，可能与卧佛亚春蜓有关
  verdict: >-
    “西南亚春蜓”是 <i>Asiagomphus hesperius</i>，正式分布在陕西、四川。iNaturalist 上鉴定为它的 5 条记录全部来自山东昆嵛山，
    说明北方爱好者已经在用这个名字称呼一种北方的亚春蜓。北京这一种还没有可靠鉴定，老姜叫它“老姜亚春蜓”，意思是可能是未描述的新种。
    要定下来，需要和卧佛亚春蜓的幼虫模式、朝鲜亚春蜓 <i>A. coreanus</i> 等近似种比对；它甚至可能就是卧佛亚春蜓从没被描述过的成虫。
  tips: 亚春蜓属，黄黑相间的中大型春蜓。
  habitat: 山区溪流。下方照片是山东的一条 iNaturalist 记录，只作参考。

- id: 13
  list_cn: 领纹缅春蜓
  cn: 领纹缅春蜓
  sci: Burmagomphus collaris
  author: (Needham, 1929)
  family: Gomphidae
  status: valid
  verdict: 学名正确。
  tips: 小型春蜓，前胸背面有一圈黄色的“领子”。
  habitat: 平原到低山的河流和溪流，常停在岸边叶片上。

- id: 14
