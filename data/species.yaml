  tips: 小型暗色春蜓，黑底带黄色细纹。
  habitat: 山区清澈的溪流，春末夏初出现。

- id: 15
  list_cn: 长腹春蜓
  cn: 长腹春蜓
  sci: Gastrogomphus abdominalis
