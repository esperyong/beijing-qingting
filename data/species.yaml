# ---------------------------------------------------------------- 色蟌科
- id: 66
  list_cn: 黑暗色蟌
  cn: 黑暗色蟌
  sci: Atrocalopteryx atrata
  author: (Selys, 1853)
  family: Calopterygidae
  status: valid
  verdict: 学名正确，北京常见。
  tips: 翅全黑、没有翅痣；雄性身体金属绿色。
  habitat: 平原和山区的缓流溪流和河道，停在岸边植物上。

- id: 67
  list_cn: 透顶单脉色蟌
  cn: 透顶单脉色蟌
  sci: Matrona basilaris
  author: Selys, 1853
  family: Calopterygidae
  status: valid
  verdict: 学名正确，北京山区溪流很常见。
  tips: 雄性翅深蓝黑色、翅脉蓝色；雌性翅褐色，有白色的伪翅痣。
  habitat: 山区溪流，北京西山、北山的溪边常见。

- id: 68
  list_cn: 绿色蟌属待定种2
  cn: 绿色蟌属待定种2
  sci: Mnais sp.
  family: Calopterygidae
  status: undetermined
  inat: 89999
  verdict_short: 《中国蜻蜓大图鉴》的待定种 2，可能是未描述的新种
  verdict: >-
    沿用《中国蜻蜓大图鉴》的“绿色蟌属待定种 2”，很可能是还没被正式描述的物种，也就是北京本地的绿色蟌。
    iNaturalist 上北京有 86 条绿色蟌记录，大多只鉴定到属，有人鉴定为烟翅绿色蟌 <i>M. mneme</i> 或安氏绿色蟌 <i>M. andersoni</i>，
    但都有鉴定者指出不对，认为就是大图鉴的待定种 2。这里的照片和统计是北京的全部绿色蟌记录。
  tips: 中型色蟌，身体金属绿色。北京照片里的雄性翅多为橙褐色，雌性翅透明略带褐色。
  habitat: 山区溪流，春末夏初（5–6 月）最多。
# ---------------------------------------------------------------- 丝蟌科
- id: 69
  list_cn: 桨尾丝蟌
  cn: 桨尾丝蟌
  sci: Lestes sponsa
  author: (Hansemann, 1823)
  family: Lestidae
  status: valid
  verdict: 学名正确。北京只有 1 条可靠的 iNaturalist 记录（延庆，2020）。
