# ---------------------------------------------------------------- 大蜓科
- id: 23
  list_cn: 双斑圆臀大蜓
  cn: 双斑圆臀大蜓
  sci: Anotogaster kuchenbeiseri
  author: (Förster, 1899)
  family: Cordulegastridae
  status: valid
  verdict: 学名正确，北京山区常见。名单里的“雌雄同体”是极罕见的发育异常个体。
  tips: 北京体型最大的蜻蜓之一，黑黄相间，复眼翠绿。雌性腹末有长长的产卵器。
