  list_cn: 褐带赤蜻
  cn: 褐带赤蜻
  sci: Sympetrum pedemontanum
  author: (Müller in Allioni, 1766)
  family: Libellulidae
  status: valid
  verdict: 学名正确。
  tips: 每片翅靠近末端都有一条褐色宽带，非常好认。
  habitat: 水渠、溪流边的草地，夏秋季。

- id: 60
  list_cn: 黄基赤蜻指名亚种
  cn: 黄基赤蜻指名亚种
  sci: Sympetrum speciosum
  author: Oguma, 1915
  family: Libellulidae
  status: valid
  inat: 325419
  verdict: 学名正确，北京有稳定记录（iNaturalist 北京 43 条）。和竖眉赤蜻一样，“指名亚种”是《中国蜻蜓大图鉴》的写法，世界蜻蜓名录不分亚种。注意中国蜻蜓名录把这个种叫“旭光赤蜻”，而《中国蜻蜓大图鉴》的旭光赤蜻是另一个种 <i>S. hypomelas</i>。
  tips: 后翅基部有一块橙色斑，雄性全身鲜红。
  habitat: 山区林间的水塘。
- id: 61
  list_cn: 条斑赤蜻指名亚种
  cn: 条斑赤蜻指名亚种
  sci: Sympetrum striolatum
  author: (Charpentier, 1840)
  family: Libellulidae
  status: valid
  inat: 55625
  verdict: 学名正确，北京很常见（iNaturalist 北京 141 条，秋季最多）。“指名亚种”是《中国蜻蜓大图鉴》的写法，对东亚种群不太合适：Pilgrim 和 von Dohlen（2007）认为东亚大陆种群应是 <i>S. s. imitoides</i>，和欧洲的指名亚种在遗传上不同。世界蜻蜓名录不分亚种，印成种名最稳妥。野外注意和普赤蜻区分。
  tips: 胸侧有清楚的浅色条纹，雄性腹部红色；额头的黑纹不向下延伸到复眼边缘（普赤蜻会延伸）。
  habitat: 池塘和湿地，9–10 月最多。
- id: 62
  list_cn: 大黄赤蜻
  cn: 大黄赤蜻
  sci: Sympetrum uniforme
  author: (Selys, 1883)
  family: Libellulidae
  status: doubtful
  verdict_short: 只有 1927 年燕京大学的老标本
  verdict: 学名正确。北京的记录只有 GBIF 上 4 件 1927 年采自燕京大学校园（今北京大学）的标本，保存在康奈尔大学，之后近百年没有公开的新记录。
  tips: 赤蜻属里个头较大的一种，全身橙黄，翅前缘也带橙色。
  habitat: 平原湿地和池塘。
- id: 63
  list_cn: 普赤蜻
  cn: 普赤蜻
  sci: Sympetrum vulgatum
  author: (Linnaeus, 1758)
  family: Libellulidae
  status: valid
