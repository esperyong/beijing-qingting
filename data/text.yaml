# 页面文案。HTML 片段里的 {n_xxx} 由 build.py 填数字；{{MAP}} 换成总览地图。

hero: {sp: 23, i: 0, pos: "50% 12%"}

lede: >-
  老姜（北京蜻蜓社社长）统计的北京蜻蜓名单共 <b>84</b> 条，又按“种 + 性别 + 色型”分成
  <b>S 传说、A 罕见、B 少见、C 常见</b> 四级，共 116 条。这一页逐条核对了学名和分类现状，
  配上可公开使用的照片和 iNaturalist 上的北京记录。

suborders:
  Anisoptera: 差翅亚目 · 蜻蜓
  Zygoptera: 均翅亚目 · 豆娘

verdict_labels:
  valid: 有效种
  renamed: 学名已更新
  undetermined: 待定种
  doubtful: 需要核实

missing:
  species: 暂时没有找到可以公开使用的照片。
  雌雄同体: 雌雄同体：同一只个体左右或前后分别长成雄性和雌性的样子，极罕见。没有找到可公开使用的照片。
  同色系: 同色系雌性：雌性长出了和雄性一样的体色。暂时没有找到这个色型可公开使用的照片。
  黄色型: 暂时没有找到黄色型雌性可公开使用的照片。
  绿色型: 暂时没有找到绿色型雌性可公开使用的照片。
  未成熟: 暂时没有找到未成熟雄性可公开使用的照片。
  拓蓝籽: 社里对一种罕见雄性个体的叫法，暂时没有找到对应照片。

tiers:
  S:
    short: 北京只有零星记录，见一次能记很久
    desc: >-
      多数是北京只有一两笔可靠记录的种类：南方偶尔飞来的迷途个体、北方高山湿地的边缘分布种，
      还有极少出现的雌性色型和雌雄同体个体。
  A:
    short: 每年只在少数地点、少数几天碰得到
    desc: >-
      北京有稳定的小种群或固定点位，但数量少、发生期短，或者只有某一性别、某一色型特别难见。
  B:
    short: 知道去哪找、季节对了能找到
    desc: >-
      分布在特定生境（山溪、水库、挺水植物多的池塘）的种类，以及常见种里比较难遇到的那一性别或色型。
  C:
    short: 季节对了，公园水边就能看到
    desc: >-
      北京的公园湖泊、河道和山区溪流里，在合适季节稳定能看到的种类和色型。

families:
  Aeshnidae:
    cn: 蜓科
    suborder: Anisoptera
    desc: 体型大、飞行能力最强。复眼在头顶大面积相接，常沿水边长时间巡飞，停落时多挂在枝叶上。
  Gomphidae:
    cn: 春蜓科
    suborder: Anisoptera
    desc: 复眼在头顶彼此分开，这是和其他蜻蜓最好认的区别。多数黄黑相间，喜欢停在河边石头、地面或水中枝头上。
  Cordulegastridae:
    cn: 大蜓科
    suborder: Anisoptera
    desc: 黑黄相间的大个子，复眼在头顶只碰到一点。雌性腹末有长长的产卵器，沿山间小溪低飞巡逻，竖着身子把卵插进溪底泥沙。
  Corduliidae:
    cn: 伪蜻科
    suborder: Anisoptera
    desc: 中型，身体常带金属绿光，复眼翠绿。北京的种类多出没于山地林间溪流和水草丰富的池塘，个体少、季节短。
  Macromiidae:
    cn: 大伪蜻科
    suborder: Anisoptera
    desc: 腿很长，黑底黄斑，复眼碧绿。雄性沿河道来回高速巡飞，很少停下，是最难拍的一类。
  Libellulidae:
    cn: 蜻科
    suborder: Anisoptera
    desc: 种类最多、最常见的一科。停落时四翅平展。很多种雄性成熟后会变红，或者身上覆一层蓝白色粉霜。北京秋天成片的红蜻蜓多是赤蜻属。
  Calopterygidae:
    cn: 色蟌科
    suborder: Zygoptera
    desc: 大型豆娘，翅宽而有色，身体有金属光泽。停在溪边植物上时翅合拢竖起，飞起来一扇一扇的，像蝴蝶。
  Lestidae:
    cn: 丝蟌科
    suborder: Zygoptera
    desc: 中型豆娘。丝蟌属停落时翅半张开；黄丝蟌属翅合拢，而且以成虫越冬，是早春最先出现的豆娘。
  Platycnemididae:
    cn: 扇蟌科
    suborder: Zygoptera
    desc: 小型豆娘。扇蟌属雄性的中、后足胫节扩大成白色的“小扇子”，求偶时会亮出来。
  Coenagrionidae:
    cn: 蟌科
    suborder: Zygoptera
    desc: 最常见的小型豆娘，以蓝、绿、橙色为主，翅透明狭长。池塘湖边的草丛里常成群出现，雌性往往有好几种色型。

