primer: |-
  <div>
    <h2>蜻蜓还是豆娘</h2>
    <p>名单里的 84 条分属两大类。看停落姿势和眼睛，几秒钟就能分开。</p>
    <div class="bodyplan">
      <figure>
        <svg viewBox="0 0 240 158" role="img" aria-label="蜻蜓俯视示意图">
          <g transform="rotate(-3 120 40)"><ellipse class="sv-wing" cx="74" cy="40" rx="45" ry="7.5"/></g>
          <g transform="rotate(3 120 40)"><ellipse class="sv-wing" cx="166" cy="40" rx="45" ry="7.5"/></g>
          <path class="sv-wing" d="M116 54 C96 46 58 48 34 56 C30 60 34 64 44 65 C70 67 100 64 116 60Z"/>
          <path class="sv-wing" d="M124 54 C144 46 182 48 206 56 C210 60 206 64 196 65 C170 67 140 64 124 60Z"/>
          <rect class="sv-stig" x="35" y="38.5" width="7" height="3" rx=".6" transform="rotate(-3 120 40)"/>
          <rect class="sv-stig" x="198" y="38.5" width="7" height="3" rx=".6" transform="rotate(3 120 40)"/>
          <rect class="sv-stig" x="38" y="56" width="7" height="3" rx=".6"/>
          <rect class="sv-stig" x="195" y="56" width="7" height="3" rx=".6"/>
          <circle class="sv-eye" cx="113.2" cy="21" r="7.2"/><circle class="sv-eye" cx="126.8" cy="21" r="7.2"/>
          <ellipse class="sv-body" cx="120" cy="44" rx="8" ry="13"/>
          <rect class="sv-body" x="117.6" y="56" width="4.8" height="88" rx="2.4"/>
          <path class="sv-lead" d="M128 14 L146 8"/><text class="sv-lab" x="148" y="11">复眼相接</text>
          <path class="sv-lead" d="M203 40 L214 16"/><text class="sv-lab" x="206" y="11">翅痣</text>
          <path class="sv-lead" d="M60 64 L40 84"/><text class="sv-lab" x="6" y="96">后翅基部宽</text>
          <path class="sv-lead" d="M124 100 L150 100"/><text class="sv-lab" x="153" y="104">腹部 10 节</text>
        </svg>
        <figcaption><b>蜻蜓</b>停落时四翅平展；后翅基部比前翅宽；复眼大多在头顶相接（春蜓科例外）。</figcaption>
      </figure>
      <figure>
        <svg viewBox="0 0 240 158" role="img" aria-label="豆娘俯视示意图">
          <ellipse class="sv-wing" cx="124" cy="84" rx="4.2" ry="40"/>
          <ellipse class="sv-wing" cx="121" cy="86" rx="4.2" ry="40"/>
          <rect class="sv-stig" x="119.8" y="117" width="3.4" height="6" rx=".6"/>
          <ellipse class="sv-body" cx="120" cy="22" rx="15" ry="4.5"/>
          <circle class="sv-eye" cx="105" cy="22" r="6"/><circle class="sv-eye" cx="135" cy="22" r="6"/>
          <ellipse class="sv-body" cx="120" cy="37" rx="5.5" ry="10"/>
          <rect class="sv-body" x="118.6" y="46" width="2.8" height="100" rx="1.4"/>
          <path class="sv-lead" d="M141 20 L166 12"/><text class="sv-lab" x="168" y="15">复眼分得很开</text>
          <path class="sv-lead" d="M126 70 L152 70"/><text class="sv-lab" x="155" y="66">四翅形状相近</text>
          <text class="sv-lab" x="155" y="80">基部收窄成柄</text>
          <path class="sv-lead" d="M116 92 L84 104"/><text class="sv-lab" x="12" y="108">停落时翅合拢</text>
        </svg>
        <figcaption><b>豆娘</b>身体细长，停落时翅大多合拢在背上（丝蟌属半张开）；两只复眼像哑铃一样分在头两侧。</figcaption>
      </figure>
    </div>
  </div>
  <div>
    <h2>分级看的是“种 + 性别 + 色型”</h2>
    <p>同一种蜻蜓，雄性可能满街都是，雌性的某个色型却十年难遇。所以老姜的分级不是给“种”打分，而是给每一种雌雄和色型分别打分。</p>
    <div class="example">
      <div class="t-C"><span class="stig sm"><i>C</i></span>混合蜓 ♂　常见</div>
      <div class="t-B"><span class="stig sm"><i>B</i></span>混合蜓 ♀ 黄色型　少见</div>
      <div class="t-S"><span class="stig sm"><i>S</i></span>混合蜓 ♀ 同色系　传说</div>
    </div>
    <dl class="glossary">
      <dt>同色系</dt><dd>雌性长成雄性的颜色（学术上叫“雄色型雌性”，andromorph）。</dd>
      <dt>黄色型 / 绿色型</dt><dd>同一种雌性的不同底色，多数种只有一种常见。</dd>
      <dt>雌雄同体</dt><dd>一只个体身上同时有雄性和雌性的特征，极罕见的发育异常。</dd>
      <dt>指名亚种</dt><dd>和种名同名的那个亚种，比如 <span class="sci">Sympetrum eroticum eroticum</span>。</dd>
    </dl>
  </div>
  <div>
    <h2>名单核查结果</h2>
    <p>逐条对照了世界蜻蜓名录（World Odonata List）、iNaturalist、GBIF 和原始论文。</p>
    <div class="verdicts">
      <button type="button" data-filter-status="valid" style="--vc:var(--c)"><b>{n_valid}</b><span>有效种，名字和学名都对得上<small>其中多数在 iNaturalist 上有北京记录</small></span></button>
      <button type="button" data-filter-status="renamed" style="--vc:var(--b)"><b>{n_renamed}</b><span>学名已更新<small>近年分类调整换了属名或升为独立种，物种本身没问题</small></span></button>
      <button type="button" data-filter-status="undetermined" style="--vc:var(--a)"><b>{n_undetermined}</b><span>待定种<small>还没有正式学名，名单里写作“待定种”或社里的叫法</small></span></button>
      <button type="button" data-filter-status="doubtful" style="--vc:var(--a)"><b>{n_doubtful}</b><span>需要核实<small>名字和学名的对应有疑问，或北京记录缺少公开证据</small></span></button>
    </div>
    <p class="muted" style="font-size:13.5px;margin-top:10px">点任意一项进入“名录核查表”，可以看到每一条的依据。</p>
  </div>

overview: |-
  <div>
    <h2>北京记录点</h2>
    <p>名单里这些种在 iNaturalist 上共有 {n_obs} 条北京记录，下图画的是其中坐标公开的 {n_pts} 个点。记录集中在城区公园、西山和北部山区溪流，这更多反映观察者去哪里，而不完全是蜻蜓在哪里。</p>
    <p>北京蜻蜓社以后的“发现地图”会把社员自己的照片和点位放进来。到那时，S 级和 A 级种类的点位最好只显示到区县一级，避免小种群被过度打扰。</p>
    <div class="legend"><span><i style="background:var(--dot)"></i>蜻蜓（差翅亚目）</span><span><i style="background:var(--dot2)"></i>豆娘（均翅亚目）</span></div>
  </div>
  <div class="mapwrap">{{MAP}}</div>

notes: |-
  <h2>名单原图</h2>
  <p class="muted" style="font-size:14px">老姜在社群里发的五张截图。点开看原图。</p>
  <div class="shots" id="shots"></div>
  <div class="cols" style="margin-top:28px">
    <div>
      <h2>怎么核查的</h2>
      <ul>
        <li>名单的中文名沿用张浩淼《中国蜻蜓大图鉴》（2019），连“待定种 2”这样的编号也是书里的。先按这本书把 84 个名字对到学名。</li>
        <li>再逐条对照<b>世界蜻蜓名录</b>（World Odonata List，2026-10-16 在线版），看学名是否仍然有效，属名有没有变，有没有被拆分或合并。</li>
        <li>用 iNaturalist 和 GBIF 查北京有没有可核实的记录（有照片、有日期和地点）。查不到的标为“需要核实”。</li>
        <li>属名变动和拆分合并，都追到了原始论文，列在右边。</li>
      </ul>
      <p style="font-size:14.5px"><b>“需要核实”不等于名单错了。</b>它只说明公开数据里还找不到证据。S 级种类本来就少，社员手里的照片很可能就是北京唯一的记录。这些照片值得上传到 iNaturalist，或者放进以后社里的发现地图。</p>
      <h2 style="margin-top:20px">照片和数字</h2>
      <ul>
        <li>{n_photos} 张照片全部来自 iNaturalist 的研究级观察和 Wikimedia Commons，许可是 CC0、CC BY、CC BY-SA、CC BY-NC 或 CC BY-NC-SA。每张都标了作者、许可和原图页面。带 NC 的只能用于非商业用途。</li>
        <li>照片上标“北京”的，是在北京拍的。没有北京照片时，用的是国内外同种的照片。</li>
        <li>某种色型（同色系、黄色型）或雌雄同体找不到可公开使用的照片时，卡片上直接写明“暂无”，不拿别的照片凑数。</li>
        <li>iNaturalist 记录数是 2026-10-16 查询的“可验证记录”数。它反映的是有多少人拍了、传了，不等于北京的真实数量。</li>
      </ul>
    </div>
